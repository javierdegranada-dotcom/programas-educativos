<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Entrenador de formulación inorgánica para ESO y Bachillerato. Funciona sin conexión a internet.">
<title>Formulación Pro — Entrenador de formulación inorgánica</title>
<style>
*,*::before,*::after{box-sizing:border-box}
:root{
  --bg:#0b1220; --card:#131c2e; --card2:#0f1728; --line:#26314a;
  --txt:#e8edf7; --muted:#9aa8c2; --acc:#6366f1; --acc2:#a855f7;
  --green:#34d399; --red:#f87171; --blue:#60a5fa; --radius:16px;
}
html,body{margin:0;padding:0}
body{
  background:var(--bg);
  background-image:radial-gradient(ellipse at 50% -10%,#1e293b 0%,#0b1220 55%,#060a13 100%);
  background-attachment:fixed;
  color:var(--txt); font-size:16px; line-height:1.5;
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  min-height:100vh;
}
sub{font-size:.72em;line-height:0}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.screen{max-width:900px;margin:0 auto;padding:16px}
.screen.center{display:flex;align-items:center;justify-content:center;min-height:100vh}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:24px;width:100%;box-shadow:0 18px 50px rgba(0,0,0,.45)}
.hero{text-align:center;margin-bottom:22px}
.logo{width:56px;height:56px;margin:0 auto 12px;display:flex;align-items:center;justify-content:center;
  font-size:30px;border-radius:14px;background:linear-gradient(135deg,var(--acc),var(--acc2))}
h1{font-size:30px;margin:0 0 4px;letter-spacing:-.5px}
h2{font-size:19px;margin:0 0 10px}
h3{font-size:16px;margin:0 0 8px}
.sub{color:var(--muted);margin:0 0 8px;font-size:15px}
.author{display:inline-block;font-size:13px;color:#c7d2fe;background:rgba(99,102,241,.14);
  border:1px solid rgba(99,102,241,.35);padding:5px 14px;border-radius:999px;margin:0}
.label{font-size:14px;text-transform:uppercase;letter-spacing:.12em;color:#c7d2fe;font-weight:700}
.muted{color:var(--muted);font-weight:400;text-transform:none;letter-spacing:0;font-size:13px}
section{margin-bottom:22px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-size:14px;font-weight:600;padding:9px 13px;border-radius:11px;
  border:1px solid var(--line);background:#0e1626;color:var(--muted);transition:.15s}
.chip:hover{border-color:#4c5a7d;color:var(--txt)}
.chip.on{background:var(--acc);border-color:#818cf8;color:#fff}
.chip-n{opacity:.7;font-size:12px;margin-left:3px}
input[type=range]{width:100%;height:8px;border-radius:6px;background:#26314a;accent-color:var(--acc2);
  -webkit-appearance:none;appearance:none;cursor:pointer}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:50%;
  background:var(--acc2);border:3px solid #fff2;cursor:pointer}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:var(--acc2);border:none}
.switch{display:flex;align-items:center;gap:10px;font-size:15px;color:var(--muted);cursor:pointer}
.switch input{width:20px;height:20px;accent-color:var(--acc)}
.primary{background:linear-gradient(90deg,var(--acc),var(--acc2));color:#fff;font-weight:700;
  padding:12px 22px;border-radius:12px;font-size:16px}
.primary:hover{filter:brightness(1.12)}
.primary.big{width:100%;padding:16px;font-size:18px}
.ghost{border:1px solid var(--line);border-radius:10px;padding:7px 12px;font-size:13px;color:var(--muted)}
.ghost:hover{color:var(--txt);border-color:#4c5a7d}
.info{margin-top:20px;border-top:1px solid var(--line);padding-top:14px;font-size:14px;color:var(--muted)}
.info summary{cursor:pointer;font-weight:600;color:#c7d2fe}
.info ul{margin:12px 0 0;padding-left:20px}
.info li{margin-bottom:8px}
.hud{display:flex;align-items:center;gap:18px;padding:12px 16px;margin-bottom:14px;
  background:var(--card2);border:1px solid var(--line);border-radius:14px}
.grow{flex:1}
.stat{display:flex;flex-direction:column;line-height:1.1}
.stat b{font-size:22px;font-weight:800}
.stat span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em}
.stat.right{text-align:right}
.green{color:var(--green)} .red{color:var(--red)} .blue{color:var(--blue)}
.game{padding:0;overflow:hidden}
.bar{height:5px;background:#1c2740}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2));transition:width .4s ease}
.ask{position:relative;padding:44px 20px 30px;text-align:center;border-bottom:1px solid var(--line)}
.tag{position:absolute;top:12px;left:14px;font-size:12px;font-weight:700;letter-spacing:.12em;
  text-transform:uppercase;color:#c7d2fe;background:rgba(99,102,241,.14);
  border:1px solid rgba(99,102,241,.3);padding:4px 10px;border-radius:999px}
.right-tag{left:auto;right:14px;background:none;border-color:transparent;color:var(--muted)}
.prompt{font-size:32px;font-weight:800;line-height:1.25;word-break:break-word;padding:0 6px}
.prompt.mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:52px;letter-spacing:1px}
.zone{padding:18px;background:var(--card2)}
.think{text-align:center;padding:22px 0}
.think p{color:var(--muted);font-style:italic;margin:0 0 18px;font-size:15px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{display:flex;align-items:center;gap:10px;text-align:left;padding:14px;min-height:62px;
  border:2px solid var(--line);border-radius:12px;background:#101a2c;font-size:16px;font-weight:600;transition:.15s}
.opt:hover:not(:disabled){border-color:var(--acc);background:rgba(99,102,241,.12)}
.opt .num{flex:0 0 24px;height:24px;border-radius:6px;background:#1d2941;color:var(--muted);
  font-size:13px;display:flex;align-items:center;justify-content:center;font-weight:700}
.opt .txt{flex:1;word-break:break-word}
.opt.good{border-color:var(--green);background:rgba(52,211,153,.16);color:#bbf7d0}
.opt.bad{border-color:var(--red);background:rgba(248,113,113,.16);color:#fecaca}
.opt.dim{opacity:.4}
.opt:disabled{cursor:default}
.fb{margin-top:16px;border-radius:12px;padding:16px}
.good-fb{background:rgba(52,211,153,.16);border:1px solid var(--green);color:#bbf7d0;
  text-align:center;font-weight:800;font-size:18px}
.bad-fb{background:rgba(248,113,113,.1);border:1px solid rgba(248,113,113,.5)}
.phrase{margin:0 0 8px;font-weight:800;font-size:17px;color:#fecaca}
.sol{margin:0 0 10px;font-size:16px}
.why{margin:0 0 14px;padding-left:20px;color:#dbe3f4;font-size:15px}
.why li{margin-bottom:6px}
.results h2{text-align:center;font-size:26px;margin-bottom:18px}
.scores{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:20px}
.sc{background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:14px;text-align:center}
.sc b{display:block;font-size:28px;font-weight:800}
.sc span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em}
.sc.green b{color:var(--green)} .sc.red b{color:var(--red)} .sc.blue b{color:var(--blue)}
.weak{background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:18px}
.weak ul{list-style:none;margin:0;padding:0}
.weak li{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line);font-size:15px}
.weak li:last-child{border:none}
.table-wrap{max-height:44vh;overflow:auto;border:1px solid var(--line);border-radius:12px;margin-bottom:18px}
table{width:100%;border-collapse:collapse;font-size:15px}
th{position:sticky;top:0;background:#162034;text-align:left;padding:10px;font-size:12px;
  text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
td{padding:10px;border-top:1px solid var(--line);vertical-align:top}
.q{font-weight:600}
.t{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.strike{text-decoration:line-through}
.sol-col{color:#c7d2fe;text-align:right}
tr.r-bad{background:rgba(248,113,113,.06)}
@media (max-width:620px){
  .screen{padding:10px}
  .card{padding:18px}
  h1{font-size:24px}
  .prompt{font-size:24px}
  .prompt.mono{font-size:38px}
  .opts{grid-template-columns:1fr}
  .hud{gap:12px;padding:10px 12px}
  .stat b{font-size:19px}
  .table-wrap{max-height:50vh}
  td,th,table{font-size:14px}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
</style>
</head>

/* --- Distractores de NOMBRE --- */
function nameDistractors(item) {
  var correct = item.n;
  var out = [];
  var seen = {};
  function add(x) {
    if (!x || x === correct || seen[x]) return;
    seen[x] = true; out.push(x);
  }

  if (item.sys) {
    var s = item.sys;
    var v1 = shuffle([1, 2, 3, 4, 5, 6, 7]).filter(function (c) { return c !== s.c1; })
      .map(function (c) { return sysName({ c1: c, w1: s.w1, c2: s.c2, w2: s.w2 }); });
    var v2 = shuffle([1, 2, 3, 4, 5, 7]).filter(function (c) { return c !== s.c2; })
      .map(function (c) { return sysName({ c1: s.c1, w1: s.w1, c2: c, w2: s.w2 }); });
    // se intercalan para que los distractores evalúen LOS DOS prefijos, no solo el primero
    for (var z = 0; z < Math.max(v1.length, v2.length); z++) {
      if (v1[z]) add(v1[z]);
      if (v2[z]) add(v2[z]);
    }
  } else if (item.ret) {
    shuffle(RETAINED_POOL).forEach(add);
  } else if (correct.indexOf('Ácido ') === 0) {
    var adj = correct.slice(6);
    var fam = null, i;
    for (i = 0; i < ACID_FAMILIES.length; i++) {
      if (ACID_FAMILIES[i].indexOf(adj) >= 0) { fam = ACID_FAMILIES[i]; break; }
    }
    if (fam) shuffle(fam).forEach(function (a) { add('Ácido ' + a); });
    var isOso = /oso$/.test(adj);
    var cross = [];
    ACID_FAMILIES.forEach(function (f) {
      if (f === fam) return;
      f.forEach(function (a) {
        if (/oso$/.test(a) === isOso && a.indexOf('hipo') !== 0 && a.indexOf('per') !== 0) cross.push('Ácido ' + a);
      });
    });
    shuffle(cross).forEach(add);
  } else {
    var p = parseStock(correct);
    if (p) {
      var lg = p.gen.toLowerCase();
      // 1. otro estado de oxidación
      if (p.rom) {
        var states = METAL_STATES[p.ent] || [1, 2, 3, 4];
        shuffle(states).forEach(function (v) {
          if (ROM[v] !== p.rom) add(buildStock(p.gen, p.ent, ROM[v]));
        });
        shuffle([1, 2, 3, 4]).forEach(function (v) {
          if (ROM[v] !== p.rom) add(buildStock(p.gen, p.ent, ROM[v]));
        });
      }
      // 2. otro anión de la misma familia
      GROUPS.forEach(function (g) {
        if (g.indexOf(lg) < 0) return;
        shuffle(g).forEach(function (w) {
          if (w !== lg) add(buildStock(w, p.ent, p.rom));
        });
      });
    }
  }

  // 3. nombres reales del mismo tipo (siempre bien escritos)
  var same = DB.filter(function (i) { return i.t === item.t && i.n !== correct; });
  var pEnt = parseStock(correct);
  if (pEnt) {
    shuffle(same).forEach(function (i) {
      var q = parseStock(i.n);
      if (q && q.ent === pEnt.ent) add(i.n);
    });
  }
  shuffle(same).forEach(function (i) { add(i.n); });
  shuffle(DB).forEach(function (i) { add(i.n); });
  return out;
}

/* --- Distractores de FÓRMULA --- */
function parseF(f) {
  var re = /(\(([^)]+)\)|[A-Z][a-z]?)(\d*)/g, m, parts = [];
  while ((m = re.exec(f)) !== null) {
    parts.push({ grp: !!m[2], s: m[2] || m[1], n: m[3] ? parseInt(m[3], 10) : 1 });
  }
  // NaOH, LiOH, CuOH... : el hidroxilo es un grupo, no dos elementos sueltos
  var L = parts.length;
  if (L >= 3 && parts[L - 2].s === 'O' && parts[L - 2].n === 1 &&
      parts[L - 1].s === 'H' && parts[L - 1].n === 1) {
    parts.splice(L - 2, 2, { grp: true, s: 'OH', n: 1 });
  }
  return parts;
}
function serF(parts) {
  return parts.map(function (p) {
    if (p.grp) return p.n === 1 ? p.s : '(' + p.s + ')' + p.n;
    return p.s + sub(p.n);
  }).join('');
}
function clone(parts) {
  return parts.map(function (p) { return { grp: p.grp, s: p.s, n: p.n }; });
}

function formulaDistractors(item) {
  var correct = item.f;
  var parts = parseF(correct);
  var out = [], seen = {};
  function add(x) {
    if (!x || x === correct || seen[x] || /[A-Za-z)]1(?!\d)/.test(x)) return;
    seen[x] = true; out.push(x);
  }

  var tier1 = [], tier2 = [];
  // A. intercambiar los subíndices (error clásico: cruzar mal las valencias)
  if (parts.length >= 2) {
    var a = parts.length - 1;
    if (parts[0].n !== parts[a].n) {
      var c = clone(parts);
      var tmp = c[0].n; c[0].n = c[a].n; c[a].n = tmp;
      tier1.push(serF(c));
    }
    // B. quitar todos los subíndices (no aplicar el m.c.m.), solo en compuestos de dos partes
    if (parts.length === 2) {
      var c2 = clone(parts);
      c2.forEach(function (p) { p.n = 1; });
      tier1.push(serF(c2));
    }
  }
  // C. variar un subíndice
  for (var i = 0; i < parts.length; i++) {
    [parts[i].n - 1, parts[i].n + 1, parts[i].n + 2, 2, 3, 4].forEach(function (v) {
      if (v < 1 || v > 9 || v === parts[i].n) return;
      var c3 = clone(parts);
      c3[i].n = v;
      (i === parts.length - 1 ? tier1 : tier2).push(serF(c3));
    });
  }
  shuffle(tier1).forEach(add);
  shuffle(tier2).forEach(add);

  // D. fórmulas reales del mismo tipo que comparten algún elemento
  var syms = parts.map(function (p) { return p.s; });
  var same = DB.filter(function (x) { return x.t === item.t && x.f !== correct; });
  shuffle(same).forEach(function (x) {
    for (var k = 0; k < syms.length; k++) if (x.f.indexOf(syms[k]) >= 0) { add(x.f); return; }
  });
  shuffle(same).forEach(function (x) { add(x.f); });
  shuffle(DB).forEach(function (x) { add(x.f); });
  return out;
}

  'Hidrácidos': 'Se nombran como el no metal terminado en —uro seguido de «de hidrógeno». En disolución acuosa reciben el nombre de ácido …hídrico.',
  'Hidruros covalentes': 'Son nombres retenidos por la IUPAC: hay que aprendérselos de memoria.',
  'Peróxidos': 'En los peróxidos aparece el grupo peroxo O₂²⁻, con carga −2 en conjunto, no dos oxígenos con −2 cada uno.',
  'Halogenuros de oxígeno': 'Los prefijos multiplicadores indican el número de átomos de cada elemento. Fíjate en que hay que contar los dos.',
  'Covalentes no metálicos': 'Entre dos no metales se usan prefijos multiplicadores, no números de oxidación.'
};

function explain(item) {
  var lines = [];
  var p = item.n && item.n.indexOf('Ácido ') !== 0 ? parseStock(item.n) : null;
  if (p && !item.sys && !item.ret) {
    var an = ANION[p.gen.toLowerCase()];
    var charge = p.rom ? ROM.indexOf(p.rom) : FIXED_CHARGE[p.ent];
    var symC = SYMBOL[p.ent];
    if (an && charge && symC) {
      var l = lcm(charge, an.c);
      var nC = l / charge, nA = l / an.c;
      var isH = an.s === 'H';
      lines.push(
        symC + ' actúa con ' + (isH ? '+' : '+') + charge + ' y ' +
        (an.s === 'OH' ? 'el grupo OH con −1' : an.s + ' con −' + an.c) + '. ' +
        'm.c.m.(' + charge + ', ' + an.c + ') = ' + l + ' → ' +
        nC + ' de ' + symC + ' y ' + nA + ' de ' + (an.s === 'OH' ? 'OH' : an.s) +
        ' → ' + item.f + '.'
      );
    }
  }
  if (item.sys) {
    var s = item.sys;
    lines.push('Los prefijos cuentan átomos: ' + s.c1 + ' de ' + (s.w1 === 'óxido' ? 'O' : s.w1) +
      ' y ' + s.c2 + ' de ' + s.w2 + '.');
  }
  if (TYPE_TIP[item.t]) lines.push(TYPE_TIP[item.t]);
  if (item.note) lines.push(item.note);
  return lines;
}

/* --- Construcción de la partida --- */
function availableCount(types) {
  return DB.filter(function (i) { return types.indexOf(i.t) >= 0; }).length;
}
function pickItems(types, count) {
  var pools = types.map(function (t) {
    return shuffle(DB.filter(function (i) { return i.t === t; }));
  });
  var chosen = [], i = 0, guard = 0;
  while (chosen.length < count && guard < 10000) {
    guard++;
    var any = false;
    for (var k = 0; k < pools.length && chosen.length < count; k++) {
      var p = pools[(i + k) % pools.length];
      if (p.length) { chosen.push(p.pop()); any = true; }
    }
    i++;
    if (!any) break;
  }
  return shuffle(chosen);
}
function buildQuestions(types, count) {
  var items = pickItems(types, count);
  var modes = [];
  for (var i = 0; i < items.length; i++) modes.push(i % 2 === 0 ? 'name' : 'formula');
  modes = shuffle(modes);
  return items.map(function (item, idx) {
    var mode = modes[idx];
    var correct = mode === 'name' ? item.n : item.f;
    var d = (mode === 'name' ? nameDistractors(item) : formulaDistractors(item)).slice(0, 5);
    return {
      item: item, mode: mode,
      prompt: mode === 'name' ? item.f : item.n,
      correct: correct,
      options: shuffle([correct].concat(d))
    };
  });
}

/* ===== INTERFAZ ===== */
var PHRASES_NORMAL = [
  'Casi.',
  'No era esa. Sigue.',
  'Revisa el razonamiento.',
  'Fallo típico: ahora ya lo sabes.',
  'Vuelve a mirarlo con calma.',
  'Este se le atraganta a todo el mundo.'
];
var PHRASES_ANIMO = [
  '¡Uy! Por poco 😅 A la siguiente cae.',
  'Fallar aquí es normal: así se aprende 💪',
  'Casi casi. Lee la explicación y sigue 🔍',
  'Este es de los traicioneros 😏 No te desanimes.',
  '¡Ojo a ese detalle! Ya no se te escapa otra vez ⚗️',
  'Error clásico, de los buenos. Ahora lo tienes 🚀',
  'Nada, a por la siguiente. Vas a poder 🔥',
  'Se te ha resistido, pero lo tienes cerca ✨'
];

var state = {
  screen: 'setup',
  selected: ['Todos'],
  count: 15,
  spicy: false,
  questions: [],
  idx: 0,
  revealed: false,
  answered: null,
  correctN: 0,
  wrongN: 0,
  history: []
};
var timer = null;
var app = document.getElementById('app');

function esc(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
function fmtFormula(s) {
  return esc(s).replace(/(\d+)/g, '<sub>$1</sub>');
}
function activeTypes() {
  return state.selected.indexOf('Todos') >= 0 ? TYPES.slice() : state.selected.slice();
}
function maxQuestions() {
  return Math.min(50, availableCount(activeTypes()));
}
function clearTimer() {
  if (timer) { clearTimeout(timer); timer = null; }
}

/* ---------- PANTALLA DE CONFIGURACIÓN ---------- */
function renderSetup() {
  var maxQ = maxQuestions();
  if (state.count > maxQ) state.count = maxQ;
  if (state.count < 5) state.count = Math.min(5, maxQ);

  var chips = ['Todos'].concat(TYPES).map(function (t) {
    var on = state.selected.indexOf(t) >= 0;
    var n = t === 'Todos' ? DB.length : DB.filter(function (i) { return i.t === t; }).length;
    return '<button class="chip' + (on ? ' on' : '') + '" data-type="' + esc(t) + '" ' +
      'aria-pressed="' + on + '">' + esc(t) + ' <span class="chip-n">' + n + '</span></button>';
  }).join('');

  app.innerHTML =
    '<div class="screen center">' +
      '<div class="card setup">' +
        '<header class="hero">' +
          '<div class="logo" aria-hidden="true">⚛</div>' +
          '<h1>Formulación Pro</h1>' +
          '<p class="sub">Entrenador de formulación inorgánica</p>' +
          '<p class="author">Javier Gijón · IES María Moliner de Segovia</p>' +
        '</header>' +

        '<section>' +
          '<h2 class="label">Temas</h2>' +
          '<div class="chips">' + chips + '</div>' +
        '</section>' +

        '<section>' +
          '<h2 class="label">Número de preguntas: <strong id="cnt">' + state.count + '</strong>' +
            ' <span class="muted">(disponibles: ' + availableCount(activeTypes()) + ')</span></h2>' +
          '<input id="slider" type="range" min="' + Math.min(5, maxQ) + '" max="' + maxQ + '" step="1" value="' + state.count + '" ' +
            'aria-label="Número de preguntas">' +
        '</section>' +

        '<section class="row">' +
          '<label class="switch"><input type="checkbox" id="spicy"' + (state.spicy ? ' checked' : '') + '> ' +
            '<span>Modo animado (mensajes de ánimo con humor al fallar)</span></label>' +
        '</section>' +

        '<button id="start" class="primary big">▶ Empezar partida</button>' +

        '<details class="info">' +
          '<summary>Criterios de nomenclatura usados</summary>' +
          '<ul>' +
            '<li>Se usa <strong>nomenclatura escolar mixta</strong>: Stock para los compuestos con metal de valencia variable, sistemática con prefijos entre no metales, y nombres tradicionales aceptados para los oxoácidos.</li>' +
            '<li>Los <strong>halogenuros de oxígeno</strong> se escriben según la recomendación IUPAC 2005 (OCl<sub>2</sub>, dicloruro de oxígeno). Muchos libros de texto españoles usan la forma antigua Cl<sub>2</sub>O («óxido de dicloro» o «anhídrido hipocloroso»): consúltalo con tu profesor antes de un examen.</li>' +
            '<li>P<sub>2</sub>O<sub>3</sub> y P<sub>2</sub>O<sub>5</sub> son fórmulas empíricas; las moléculas reales son P<sub>4</sub>O<sub>6</sub> y P<sub>4</sub>O<sub>10</sub>.</li>' +
            '<li>Algunos compuestos (AgOH, FeH<sub>3</sub>, I<sub>2</sub>O<sub>7</sub>) son <strong>ejercicios formales de valencias</strong>: se avisa de ello al corregir.</li>' +
          '</ul>' +
        '</details>' +
      '</div>' +
    '</div>';

  Array.prototype.forEach.call(document.querySelectorAll('.chip'), function (b) {
    b.onclick = function () { toggleType(b.getAttribute('data-type')); };
  });
  var sl = document.getElementById('slider');
  sl.oninput = function () {
    state.count = parseInt(sl.value, 10);
    document.getElementById('cnt').textContent = state.count;
  };
  document.getElementById('spicy').onchange = function (e) { state.spicy = e.target.checked; };
  document.getElementById('start').onclick = startGame;
}

function toggleType(t) {
  if (t === 'Todos') { state.selected = ['Todos']; }
  else {
    var s = state.selected.filter(function (x) { return x !== 'Todos'; });
    if (s.indexOf(t) >= 0) s = s.filter(function (x) { return x !== t; });
    else s.push(t);
    state.selected = s.length ? s : ['Todos'];
  }
  render();
}

/* ---------- PARTIDA ---------- */
function startGame() {
  var types = activeTypes();
  var n = Math.min(state.count, availableCount(types));
  state.questions = buildQuestions(types, n);
  state.idx = 0; state.revealed = false; state.answered = null;
  state.correctN = 0; state.wrongN = 0; state.history = [];
  state.screen = 'playing';
  render();
}

function answer(opt) {
  if (state.answered !== null) return;          // protección explícita contra dobles pulsaciones
  var q = state.questions[state.idx];
  var ok = opt === q.correct;
  state.answered = opt;
  if (ok) state.correctN++; else state.wrongN++;
  state.history.push({ q: q, user: opt, ok: ok });
  render();
  if (ok) {
    clearTimer();
    timer = setTimeout(next, 1200);             // acierto: avance rápido
  }                                              // fallo: espera a que el alumno lea y pulse Siguiente
}

function next() {
  clearTimer();
  if (state.idx < state.questions.length - 1) {
    state.idx++; state.revealed = false; state.answered = null;
    render();
  } else {
    state.screen = 'finished';
    render();
  }
}

function renderPlaying() {
  var q = state.questions[state.idx];
  var total = state.questions.length;
  var done = state.idx + (state.answered !== null ? 1 : 0);
  var pct = Math.round((done / total) * 100);
  var isNombra = q.mode === 'name';
  var ok = state.answered !== null && state.answered === q.correct;

  var opts = '';
  if (state.revealed) {
    opts = q.options.map(function (o, i) {
      var cls = 'opt';
      if (state.answered !== null) {
        if (o === q.correct) cls += ' good';
        else if (o === state.answered) cls += ' bad';
        else cls += ' dim';
      }
      var txt = isNombra ? esc(o) : fmtFormula(o);
      return '<button class="' + cls + '" data-opt="' + esc(o) + '"' +
        (state.answered !== null ? ' disabled' : '') + '>' +
        '<span class="num">' + (i + 1) + '</span><span class="txt">' + txt + '</span></button>';
    }).join('');
  }

  var feedback = '';
  if (state.answered !== null) {
    if (ok) {
      feedback = '<div class="fb good-fb" role="status">✔ ¡Correcto!</div>';
    } else {
      var phr = state.spicy
        ? PHRASES_ANIMO[Math.floor(Math.random() * PHRASES_ANIMO.length)]
        : PHRASES_NORMAL[Math.floor(Math.random() * PHRASES_NORMAL.length)];
      var lines = explain(q.item).map(function (l) { return '<li>' + esc(l) + '</li>'; }).join('');
      feedback =
        '<div class="fb bad-fb" role="alert">' +
          '<p class="phrase">' + esc(phr) + '</p>' +
          '<p class="sol">La respuesta correcta era <strong>' +
            (isNombra ? esc(q.correct) : fmtFormula(q.correct)) + '</strong></p>' +
          (lines ? '<ul class="why">' + lines + '</ul>' : '') +
          '<button id="next" class="primary">Siguiente →</button>' +
        '</div>';
    }
  }

  app.innerHTML =
    '<div class="screen play">' +
      '<div class="hud">' +
        '<div class="stat"><b class="green">' + state.correctN + '</b><span>Bien</span></div>' +
        '<div class="stat"><b class="red">' + state.wrongN + '</b><span>Mal</span></div>' +
        '<div class="grow"></div>' +
        '<div class="stat right"><b>' + (state.idx + 1) + ' / ' + total + '</b><span>Pregunta</span></div>' +
        '<button id="quit" class="ghost" title="Abandonar la partida">Salir</button>' +
      '</div>' +

      '<div class="card game">' +
        '<div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="' + pct + '">' +
          '<i style="width:' + pct + '%"></i></div>' +

        '<div class="ask">' +
          '<span class="tag">' + esc(q.item.t) + '</span>' +
          '<span class="tag right-tag">' + (isNombra ? 'NOMBRA' : 'FORMULA') + '</span>' +
          '<div class="prompt' + (isNombra ? ' mono' : '') + '">' +
            (isNombra ? fmtFormula(q.prompt) : esc(q.prompt)) + '</div>' +
        '</div>' +

        '<div class="zone" aria-live="polite">' +
          (state.revealed
            ? '<div class="opts">' + opts + '</div>'
            : '<div class="think"><p>Piensa la respuesta antes de ver las opciones…</p>' +
              '<button id="show" class="primary">Mostrar opciones</button></div>') +
          feedback +
        '</div>' +
      '</div>' +
    '</div>';

  var showBtn = document.getElementById('show');
  if (showBtn) showBtn.onclick = function () { state.revealed = true; render(); };
  Array.prototype.forEach.call(document.querySelectorAll('.opt'), function (b) {
    b.onclick = function () { answer(b.getAttribute('data-opt')); };
  });
  var nb = document.getElementById('next');
  if (nb) { nb.onclick = next; nb.focus(); }
  document.getElementById('quit').onclick = function () {
    clearTimer();
    if (state.history.length === 0) { state.screen = 'setup'; }
    else { state.questions = state.questions.slice(0, state.history.length); state.screen = 'finished'; }
    render();
  };
}

/* ---------- RESULTADOS ---------- */
function renderFinished() {
  var total = state.history.length || 1;
  var pct = Math.round((state.correctN / total) * 100);

  var byType = {};
  state.history.forEach(function (h) {
    var t = h.q.item.t;
    if (!byType[t]) byType[t] = { ok: 0, bad: 0 };
    if (h.ok) byType[t].ok++; else byType[t].bad++;
  });
  var weak = Object.keys(byType).filter(function (t) { return byType[t].bad > 0; })
    .sort(function (a, b) { return byType[b].bad - byType[a].bad; });

  var breakdown = weak.length
    ? '<div class="weak"><h3>Dónde has fallado</h3><ul>' +
      weak.map(function (t) {
        var d = byType[t];
        return '<li><span>' + esc(t) + '</span><b>' + d.bad + ' de ' + (d.ok + d.bad) + '</b></li>';
      }).join('') + '</ul></div>'
    : '<div class="weak"><h3>Sin fallos. Excelente.</h3></div>';

  var rows = state.history.map(function (h) {
    var isNombra = h.q.mode === 'name';
    return '<tr class="' + (h.ok ? '' : 'r-bad') + '">' +
      '<td><div class="q">' + (isNombra ? fmtFormula(h.q.prompt) : esc(h.q.prompt)) + '</div>' +
        '<div class="t">' + esc(h.q.item.t) + '</div></td>' +
      '<td class="' + (h.ok ? 'green' : 'red strike') + '">' +
        (isNombra ? esc(h.user) : fmtFormula(h.user)) + '</td>' +
      '<td class="sol-col">' + (isNombra ? esc(h.q.correct) : fmtFormula(h.q.correct)) + '</td>' +
    '</tr>';
  }).join('');

  app.innerHTML =
    '<div class="screen center">' +
      '<div class="card results">' +
        '<h2>Resultados</h2>' +
        '<div class="scores">' +
          '<div class="sc green"><b>' + state.correctN + '</b><span>Aciertos</span></div>' +
          '<div class="sc red"><b>' + state.wrongN + '</b><span>Fallos</span></div>' +
          '<div class="sc blue"><b>' + pct + '%</b><span>Precisión</span></div>' +
        '</div>' +
        breakdown +
        '<div class="table-wrap"><table>' +
          '<thead><tr><th>Pregunta</th><th>Tu respuesta</th><th>Correcta</th></tr></thead>' +
          '<tbody>' + rows + '</tbody>' +
        '</table></div>' +
        '<button id="again" class="primary big">↻ Nueva sesión</button>' +
      '</div>' +
    '</div>';

  document.getElementById('again').onclick = function () { state.screen = 'setup'; render(); };
}

/* ---------- ROUTER ---------- */
function render() {
  if (state.screen === 'setup') renderSetup();
  else if (state.screen === 'playing') renderPlaying();
  else renderFinished();
}

document.addEventListener('keydown', function (e) {
  if (state.screen !== 'playing') return;
  if (!state.revealed && (e.key === 'Enter' || e.key === ' ')) {
    var s = document.getElementById('show');
    if (s) { e.preventDefault(); s.click(); }
    return;
  }
  if (state.revealed && state.answered === null && /^[1-6]$/.test(e.key)) {
    var b = document.querySelectorAll('.opt')[parseInt(e.key, 10) - 1];
    if (b) b.click();
  }
  if (state.answered !== null && e.key === 'Enter') {
    var n = document.getElementById('next');
    if (n) n.click();
  }
});

window.addEventListener('beforeunload', clearTimer);
render();

})();
</script>
</body>
</html>
