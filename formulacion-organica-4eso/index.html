<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master en Formulación - 4º ESO (Con IDs)</title>
    <style>
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --secondary: #ec4899;
            --success: #22c55e;
            --danger: #ef4444;
            --warning: #f59e0b;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', system-ui, sans-serif; }

        body {
            background-color: var(--bg);
            background-image: radial-gradient(circle at 2px 2px, #e2e8f0 1px, transparent 0);
            background-size: 40px 40px;
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .app-container {
            background: var(--card-bg);
            width: 100%;
            max-width: 950px;
            border-radius: 24px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            border: 1px solid #e2e8f0;
            position: relative;
        }

        .header {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            padding: 30px;
            color: white;
            text-align: center;
        }

        .header h1 { font-size: 1.8rem; margin-bottom: 5px; }
        .header p { opacity: 0.9; font-size: 0.9rem; }

        .view { padding: 30px; display: none; }
        .view.active { display: block; animation: fadeIn 0.4s ease; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .group-title {
            font-size: 0.85rem;
            font-weight: 800;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin: 20px 0 10px 5px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .group-title::after { content: ""; flex: 1; height: 1px; background: #e2e8f0; }

        .grid-menu {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 12px;
            margin-bottom: 20px;
        }

        .card-btn {
            background: white;
            border: 2px solid #e2e8f0;
            padding: 18px;
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            text-align: center;
        }

        .card-btn:hover { border-color: var(--primary); background: #f5f3ff; transform: translateY(-2px); }

        .stats-bar {
            display: flex;
            justify-content: space-between;
            background: #f1f5f9;
            padding: 15px 25px;
            border-radius: 12px;
            margin-bottom: 25px;
        }

        .stat-item { text-align: center; }
        .stat-label { font-size: 0.75rem; color: #64748b; text-transform: uppercase; font-weight: 700; }
        .stat-value { font-size: 1.2rem; font-weight: 800; color: var(--primary); }

        .formula-box {
            background: #ffffff;
            border: 2px solid #e2e8f0;
            border-radius: 16px;
            padding: 40px 20px;
            margin-bottom: 5px;
            min-height: 260px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.3rem;
            overflow-x: auto;
            position: relative;
        }

        /* ID Badge en esquina superior derecha */
        .compound-id {
            position: absolute;
            top: 10px;
            right: 10px;
            background: var(--primary);
            color: white;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 800;
            font-family: monospace;
        }

        /* CORRECCIÓN DE ALINEACIÓN DE TABLAS */
        .formula-display table { border-collapse: collapse; line-height: 1.1; margin: 0 auto; }
        .formula-display td { 
            padding: 0 2px; 
            text-align: center; 
            font-family: 'Courier New', monospace; 
            font-weight: bold;
            min-width: 30px; 
        }

        .input-group input[type="text"] {
            width: 100%;
            padding: 18px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 1.1rem;
            text-align: center;
            transition: border-color 0.2s;
        }

        .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px; }

        button { padding: 15px; border-radius: 12px; border: none; font-weight: 700; cursor: pointer; transition: all 0.2s; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-outline { background: #f1f5f9; color: var(--text); }

        .feedback {
            margin-top: 20px;
            padding: 15px;
            border-radius: 12px;
            font-weight: 600;
            display: none;
            text-align: center;
        }
        .feedback.correct { background: #dcfce7; color: #166534; border: 1px solid #bbf7d0; }
        .feedback.wrong { background: #fee2e2; color: #991b1b; border: 1px solid #fecaca; }

        .progress-container { height: 6px; background: #e2e8f0; width: 100%; position: absolute; bottom: 0; }
        .progress-bar { height: 100%; background: var(--success); width: 0%; transition: width 0.3s; }

        @media (max-width: 600px) { .actions { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="header" style="position: relative;">
            <h1>Master en Formulación - 4º ESO</h1>
            <p>Versión con IDs de compuestos para facilitar correcciones</p>
            <div class="progress-container">
                <div class="progress-bar" id="progressBar"></div>
            </div>
        </div>

        <div id="view-menu" class="view active">
            <div class="group-title">Hidrocarburos y Alcoholes</div>
            <div class="grid-menu">
                <button class="card-btn" onclick="initPractice('hidrocarburos')"><span>⚡ Hidrocarburos</span><small id="cnt-hid">...</small></button>
                <button class="card-btn" onclick="initPractice('alcoholes')"><span>🍷 Alcoholes</span><small id="cnt-alc">...</small></button>
            </div>

            <div class="group-title">Familias de Compuestos Oxigenados</div>
            <div class="grid-menu">
                <button class="card-btn" onclick="initPractice('aldehidos')"><span>🔬 Aldehídos</span><small id="cnt-ald">...</small></button>
                <button class="card-btn" onclick="initPractice('cetonas')"><span>🧬 Cetonas</span><small id="cnt-cet">...</small></button>
                <button class="card-btn" onclick="initPractice('acidos')"><span>🧪 Ácidos Carboxílicos</span><small id="cnt-aci">...</small></button>
                <button class="card-btn" onclick="initPractice('esteres')"><span>🧪 Ésteres</span><small id="cnt-est">...</small></button>
            </div>

            <div class="group-title">Repaso General</div>
            <button class="card-btn" style="width: 100%; background: #f8fafc;" onclick="initPractice('todos')">
                <span>🔀 Mezclado Proporcional</span>
                <small id="cnt-all">...</small>
            </button>

            <div style="margin-top: 30px; padding: 20px; background: #f1f5f9; border-radius: 16px; text-align: center;">
                <label style="display:block; margin-bottom:10px; font-weight:700;">Límite de preguntas:</label>
                <input type="number" id="practice-limit" min="1" step="1" style="padding: 12px; width: 100px; border-radius: 8px; border: 2px solid #cbd5e1; text-align: center; font-weight: 800;" placeholder="Todas">
            </div>
        </div>

        <div id="view-practice" class="view">
            <div style="margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center;">
                <button class="btn-outline" style="padding: 8px 15px; font-size: 0.8rem;" onclick="showMenu()">← Menú</button>
                <span id="label-group" style="font-weight: 800; color: var(--primary);"></span>
            </div>

            <div class="stats-bar">
                <div class="stat-item"><div class="stat-label">Pregunta</div><div class="stat-value" id="stat-pos">1/0</div></div>
                <div class="stat-item"><div class="stat-label">Puntos</div><div class="stat-value" id="stat-score" style="color: var(--success);">0</div></div>
                <div class="stat-item"><div class="stat-label">Acierto</div><div class="stat-value" id="stat-acc">0%</div></div>
            </div>

            <div class="question-container">
                <h4 style="margin-bottom: 15px; color: #64748b;">Nombra este compuesto:</h4>
                <div class="formula-box" id="formula-display">
                    <span class="compound-id" id="compound-id">ID: H001</span>
                </div>
                <div class="input-group">
                    <input type="text" id="answer-input" placeholder="Nombre IUPAC..." autocomplete="off">
                    <div id="feedback-box" class="feedback"></div>
                    <div id="hint-box" class="feedback" style="background:#fef9c3; color:#854d0e; border:1px solid #fde68a;"></div>
                </div>

                <div class="actions">
                    <button id="btn-check" class="btn-primary" onclick="checkAnswer()">Comprobar</button>
                    <button id="btn-next" class="btn-primary" style="display: none; background: var(--success);" onclick="nextQuestion()">Siguiente ➜</button>
                    <button id="btn-hint" class="btn-outline" onclick="getHint()">Pedir Pista</button>
                </div>
            </div>
        </div>

        <div id="view-summary" class="view">
            <div style="text-align:center; padding: 10px 0 25px;">
                <div style="font-size: 3rem;">🎯</div>
                <h2 style="margin: 10px 0 5px;">¡Repaso completado!</h2>
                <p style="color:#64748b;">Grupo: <span id="summary-group" style="font-weight:800; color:var(--primary);"></span></p>
            </div>

            <div class="stats-bar" style="margin-bottom: 25px;">
                <div class="stat-item"><div class="stat-label">Correctas</div><div class="stat-value" id="summary-score" style="color: var(--success);">0/0</div></div>
                <div class="stat-item"><div class="stat-label">Acierto</div><div class="stat-value" id="summary-pct">0%</div></div>
            </div>

            <div id="summary-comment" style="background:#f1f5f9; border-radius:16px; padding:20px; font-size:0.95rem; line-height:1.5; margin-bottom: 25px;"></div>

            <button class="btn-primary" style="width:100%;" onclick="showMenu()">← Volver al menú</button>
        </div>
    </div>

        let sessionData = [];
        let currentIndex = 0;
        let score = 0;
        let totalAnswered = 0;
        let currentType = '';
        let catStats = {};

        const GROUP_ORDER = ['hidrocarburos', 'alcoholes', 'aldehidos', 'cetonas', 'acidos', 'esteres'];
        const GROUP_LABELS = {
            hidrocarburos: 'Hidrocarburos', alcoholes: 'Alcoholes', aldehidos: 'Aldehídos',
            cetonas: 'Cetonas', acidos: 'Ácidos Carboxílicos', esteres: 'Ésteres', todos: 'Repaso Mezclado'
        };

        function updateMenuCounters() {
            for(let k in DB) {
                let el = document.getElementById('cnt-' + k.substring(0,3));
                if(el) el.innerText = `${DB[k].length} compuestos`;
            }
            let total = Object.values(DB).reduce((a, b) => a + b.length, 0);
            document.getElementById('cnt-all').innerText = `${total} compuestos disponibles`;
        }

        function showMenu() {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.getElementById('view-menu').classList.add('active');
            document.getElementById('progressBar').style.width = "0%";
            updateMenuCounters();
        }

        function initPractice(type) {
            const limitInput = document.getElementById('practice-limit');
            let limitVal = parseInt(limitInput.value);
            if(!isNaN(limitVal) && limitVal < 1) { limitVal = NaN; limitInput.value = ""; }
            let pool = [];

            if(type === 'todos') {
                for(let k in DB) pool = pool.concat(DB[k].map(item => ({...item, cat: k})));
            } else {
                pool = DB[type].map(item => ({...item, cat: type}));
            }

            pool.sort(() => Math.random() - 0.5);
            if(!isNaN(limitVal) && limitVal > 0) pool = pool.slice(0, limitVal);
            sessionData = pool;

            currentIndex = 0; score = 0; totalAnswered = 0;
            currentType = type;
            catStats = {};
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.getElementById('view-practice').classList.add('active');
            document.getElementById('label-group').innerText = type.toUpperCase();
            loadQuestion();
        }

        function loadQuestion() {
            if(currentIndex >= sessionData.length) { showSummary(); return; }
            const item = sessionData[currentIndex];

            document.getElementById('formula-display').innerHTML = `
                <span class="compound-id" id="compound-id">ID: ${item.id}</span>
                <div class="formula-display">${item.formula}</div>
            `;
            document.getElementById('answer-input').value = "";
            document.getElementById('answer-input').disabled = false;
            document.getElementById('feedback-box').style.display = "none";
            document.getElementById('hint-box').style.display = "none";
            document.getElementById('btn-check').style.display = "block";
            document.getElementById('btn-next').style.display = "none";
            updateStats();
            document.getElementById('answer-input').focus();
        }

        function checkAnswer() {
            const userVal = normalizeText(document.getElementById('answer-input').value);
            const item = sessionData[currentIndex];
            const correctVal = normalizeText(item.nombre);
            const feedback = document.getElementById('feedback-box');
            
            if(!userVal) return;
            totalAnswered++;
            document.getElementById('answer-input').disabled = true;
            document.getElementById('btn-check').style.display = "none";
            document.getElementById('btn-next').style.display = "block";

            if(!catStats[item.cat]) catStats[item.cat] = { correct: 0, total: 0 };
            catStats[item.cat].total++;

            if(userVal === correctVal) {
                score++;
                catStats[item.cat].correct++;
                feedback.innerHTML = "✨ ¡Correcto!";
                feedback.className = "feedback correct";
            } else {
                feedback.innerHTML = `❌ Incorrecto. Es: <b>${item.nombre}</b><br><small>ID del compuesto: ${item.id}</small>`;
                feedback.className = "feedback wrong";
            }
            feedback.style.display = "block";
            updateStats();
        }

        function nextQuestion() { currentIndex++; loadQuestion(); }

        function getHint() {
            const correct = sessionData[currentIndex].nombre;
            const id = sessionData[currentIndex].id;
            const hintBox = document.getElementById('hint-box');
            hintBox.innerHTML = `💡 Pista (ID: ${id}): empieza por "<b>${correct.substring(0, 4)}...</b>"`;
            hintBox.style.display = "block";
        }

        function showSummary() {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.getElementById('view-summary').classList.add('active');

            const pct = totalAnswered === 0 ? 0 : Math.round((score / totalAnswered) * 100);
            document.getElementById('summary-group').innerText = GROUP_LABELS[currentType] || currentType;
            document.getElementById('summary-score').innerText = `${score}/${totalAnswered}`;
            document.getElementById('summary-pct').innerText = `${pct}%`;
            document.getElementById('summary-comment').innerHTML = buildRecommendation(pct);
        }

        function buildRecommendation(pct) {
            if(currentType === 'todos') {
                let weakestCat = null, weakestPct = 101;
                for(const cat in catStats) {
                    const s = catStats[cat];
                    if(s.total === 0) continue;
                    const p = (s.correct / s.total) * 100;
                    if(p < weakestPct) { weakestPct = p; weakestCat = cat; }
                }
                if(pct >= 85) {
                    return `¡Excelente nivel general! Dominas bien todos los grupos de este repaso mezclado.`;
                } else if(weakestCat && weakestPct < 65) {
                    return `Vas razonablemente bien, pero el grupo de <b>${GROUP_LABELS[weakestCat]}</b> (${Math.round(weakestPct)}% de aciertos) es donde más flojeas. Te vendría bien practicarlo por separado antes de repetir el repaso mezclado.`;
                } else {
                    return `Vas por buen camino. Repite el repaso mezclado una vez más para afianzar los detalles que aún se te resisten.`;
                }
            }

            const idx = GROUP_ORDER.indexOf(currentType);
            const label = GROUP_LABELS[currentType];

            if(pct >= 85) {
                const next = GROUP_ORDER[idx + 1];
                return next
                    ? `¡Excelente dominio de ${label}! Puedes avanzar con confianza al grupo de <b>${GROUP_LABELS[next]}</b>.`
                    : `¡Excelente dominio de ${label}! Has completado con nota el último grupo de la progresión.`;
            } else if(pct >= 60) {
                return `Vas bien con ${label}, pero conviene repetir este mismo grupo una vez más para afianzarlo antes de avanzar.`;
            } else {
                const prev = idx > 0 ? GROUP_ORDER[idx - 1] : null;
                return prev
                    ? `Este grupo se te está resistiendo. Te recomendamos bajar a repasar <b>${GROUP_LABELS[prev]}</b> para reforzar la base antes de volver a intentar ${label}.`
                    : `Este grupo se te está resistiendo. Repite este mismo bloque con calma, compuesto a compuesto, antes de seguir avanzando.`;
            }
        }

        function updateStats() {
            document.getElementById('stat-pos').innerText = `${currentIndex + 1}/${sessionData.length}`;
            document.getElementById('stat-score').innerText = score;
            const acc = totalAnswered === 0 ? 0 : Math.round((score / totalAnswered) * 100);
            document.getElementById('stat-acc').innerText = `${acc}%`;
            document.getElementById('progressBar').style.width = `${(currentIndex / sessionData.length) * 100}%`;
        }

        function normalizeText(str) {
            return str.toLowerCase().trim().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/\s+/g, ' ').replace(/-/g, '');
        }

        document.getElementById('answer-input').addEventListener('keypress', (e) => {
            if(e.key === 'Enter') {
                if(document.getElementById('btn-check').style.display !== 'none') checkAnswer();
                else nextQuestion();
            }
        });

        document.getElementById('practice-limit').addEventListener('input', function() {
            if(this.value !== "" && parseInt(this.value) < 1) this.value = "";
        });

        window.onload = updateMenuCounters;
    </script>
